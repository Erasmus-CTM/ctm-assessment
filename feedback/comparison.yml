ai-feedback:
  policies:
    guiding-question:
      extends: brief-practice
      steps:
        - step-prompt: Ask one guiding question about the first algebraic step. Do not provide calculations or the answer.
    worked-explanation:
      extends: practice-feedback
      max-words: 180
      steps:
        - step-prompt: Give a complete worked solution, explaining each algebraic step.
          allow-full-solution: true
