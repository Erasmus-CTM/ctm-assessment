lang: en
project:
  type: website
  output-dir: _site
  resources:
    - resolved-repos.json
  render:
    - index.qmd
    - example.qmd
    - examples.qmd
website:
  title: CTM Assessment
  navbar:
    left:
      - href: index.qmd
        text: Overview
      - href: example.qmd
        text: Working examples
format:
  html:
    toc: true
    theme: cosmo
ai-feedback:
  policy-files: feedback.yml
  project-policy: course-feedback
  mode: copy
  storage: local
py-exercise:
  feedback: true
  show-test-hints: true
  submission: false

pyodide:
  feedback: true
  feedback-hints: true

# JSXGraph loads its library in the browser; pin the versions tested here
# (the same as the extension's bundled resources) until upstream pins them.
jsxgraph:
  src_jxg: https://cdn.jsdelivr.net/npm/jsxgraph@1.13.3/distrib/jsxgraphcore.js
  src_css: https://cdn.jsdelivr.net/npm/jsxgraph@1.13.3/distrib/jsxgraph.css
  src_mjx: https://cdn.jsdelivr.net/npm/mathjax@4.1.3/tex-mml-svg.js
