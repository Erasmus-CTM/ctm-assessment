# Library versions for JSXGraph boards: the earliest tested release line or any
# later release within it (no unannounced major upgrade). ctm-assessment.lua
# uses them unless the project sets its own `jsxgraph:` values. Remove once the
# JSXGraph extension's defaults do the same.
jsxgraph:
  src_jxg: https://cdn.jsdelivr.net/npm/jsxgraph@1/distrib/jsxgraphcore.js
  src_css: https://cdn.jsdelivr.net/npm/jsxgraph@1/distrib/jsxgraph.css
  src_mjx: https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-svg.js
