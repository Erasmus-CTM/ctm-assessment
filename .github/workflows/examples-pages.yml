name: Test, render and publish examples

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ctm-assessment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Select explicit review dependencies (main keeps normal defaults)
        id: review
        env:
          REVIEW_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/review-dependencies.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install sympy==1.13.3 networkx==3.4.2 PyYAML==6.0.2
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.8.27'
      - name: Render and exercise the examples
        run: |
          set -o pipefail
          python scripts/setup-feedback-integration.py --review-refs "$CTM_REVIEW_REFS" --test 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test all five integration tabs
        env:
          CTM_INTEGRATION_SITE: ${{ github.workspace }}/.feedback-workspace/site/_site
        run: |
          set -o pipefail
          npm run test:browser 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Report failure details as an annotation
        if: failure()
        run: |
          printf '::error title=Last build output::%s\n' "$(grep -v '^\s*$' "$RUNNER_TEMP/build.log" | tail -40 | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\n/%0A/g')"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rendered-examples
          path: .feedback-workspace/site/_site
      - uses: actions/upload-artifact@v4
        with:
          name: ctm-assessment-package
          path: .feedback-workspace/ctm-assessment.tar.gz
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: .feedback-workspace/site/_site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: ctm-assessment-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy examples
        id: deployment
        uses: actions/deploy-pages@v4
