name: Test, render and publish examples

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type broad testing campaign to authorize the broad jobs'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ctm-assessment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  campaign:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Confirm the explicitly requested broad campaign
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != 'broad testing campaign' ]; then
            echo '::error::Broad jobs require the exact confirmation: broad testing campaign'
            exit 1
          fi

  # The fast tier: every unit and source-contract test that needs no Quarto,
  # no browser and no download (about two minutes).
  source:
    runs-on: ubuntu-latest
    outputs:
      repin: ${{ steps.changes.outputs.repin }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Does this pull request change the package's pins or builder?
        id: changes
        if: github.event_name == 'pull_request'
        run: |
          # The pull request's merge commit: its first parent is the base.
          if git diff --name-only HEAD^1 HEAD | grep -qxE 'integration/feedback/repos\.json|scripts/setup-feedback-integration\.py|scripts/test-package\.py'; then
            echo repin=true >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - name: Unit and source-contract tests without rendering or browser downloads
        run: npm test
      - name: Python unit tests without rendering or downloads
        run: python -m unittest discover -s tests -p 'test_*.py'

  # main renders and publishes; a confirmed campaign and a pull request that
  # re-pins the package also run every component's tests (--test).
  build:
    if: ${{ !cancelled() && needs.source.result == 'success' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || needs.campaign.result == 'success' || (github.event_name == 'pull_request' && needs.source.outputs.repin == 'true')) }}
    needs: [source, campaign]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Select explicit review dependencies (main keeps normal defaults)
        id: review
        env:
          REVIEW_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/ci/review-dependencies.py
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install sympy==1.13.3 'networkx>=3.4' 'PyYAML>=6'  # SymPy: the version Pyodide 0.28.3 ships
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.8.27'
      - name: Render and exercise the examples
        run: |
          set -o pipefail
          tests=(); [ "${{ github.event_name }}" = push ] || tests=(--test)
          python scripts/setup-feedback-integration.py --review-refs "$CTM_REVIEW_REFS" "${tests[@]}" 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Install Chromium
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 5
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          npx playwright install --with-deps chromium
      - name: Test all five integration tabs
        if: github.event_name == 'workflow_dispatch'
        env:
          CTM_INTEGRATION_SITE: ${{ github.workspace }}/.feedback-workspace/site/_site
        run: |
          set -o pipefail
          npm run test:browser 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Report failure details as an annotation
        if: failure()
        run: |
          printf '::error title=Last build output::%s\n' "$(grep -v '^\s*$' "$RUNNER_TEMP/build.log" | tail -40 | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\n/%0A/g')"
          if grep -q 'not ok' "$RUNNER_TEMP/build.log"; then
            printf '::error title=Failing tests::%s\n' "$(grep -B2 -A22 'not ok' "$RUNNER_TEMP/build.log" | grep -v 'duration_ms\|^\s*$' | head -c 6000 | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\n/%0A/g')"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rendered-examples
          path: .feedback-workspace/site/_site
      - uses: actions/upload-artifact@v7
        with:
          name: ctm-assessment-package
          path: .feedback-workspace/ctm-assessment.tar.gz
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: .feedback-workspace/site/_site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: ctm-assessment-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy examples
        id: deployment
        uses: actions/deploy-pages@v5
