name: Test, render and publish examples

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type broad testing campaign to authorize the broad jobs'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ctm-assessment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  campaign:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Confirm the explicitly requested broad campaign
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != 'broad testing campaign' ]; then
            echo '::error::Broad jobs require the exact confirmation: broad testing campaign'
            exit 1
          fi

  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - name: Source contracts without rendering or browser downloads
        run: >-
          node --test tests/ci-policy.test.cjs tests/compare-browser.test.cjs
          tests/compare-courses-workflow.test.cjs tests/compare-pyodide-settings.test.cjs
          tests/compare-rendered.test.cjs tests/compare-rendered-store.test.cjs
          tests/compare-rendered-assets.test.cjs tests/parity-capture.test.cjs
          tests/parity-checkers.test.cjs tests/parity-variants.test.cjs

  build:
    if: ${{ !cancelled() && needs.source.result == 'success' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || needs.campaign.result == 'success') }}
    needs: [source, campaign]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Select explicit review dependencies (main keeps normal defaults)
        id: review
        env:
          REVIEW_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/ci/review-dependencies.py
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install sympy==1.13.3 'networkx>=3.4' 'PyYAML>=6'  # SymPy: the version Pyodide 0.28.3 ships
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.8.27'
      - name: Render and exercise the examples
        run: |
          set -o pipefail
          tests=(); [ "${{ github.event_name }}" != workflow_dispatch ] || tests=(--test)
          python scripts/setup-feedback-integration.py --review-refs "$CTM_REVIEW_REFS" "${tests[@]}" 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Install Chromium
        if: github.event_name == 'workflow_dispatch'
        run: npx playwright install --with-deps chromium
      - name: Test all five integration tabs
        if: github.event_name == 'workflow_dispatch'
        env:
          CTM_INTEGRATION_SITE: ${{ github.workspace }}/.feedback-workspace/site/_site
        run: |
          set -o pipefail
          npm run test:browser 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Report failure details as an annotation
        if: failure()
        run: |
          printf '::error title=Last build output::%s\n' "$(grep -v '^\s*$' "$RUNNER_TEMP/build.log" | tail -40 | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\n/%0A/g')"
          if grep -q 'not ok' "$RUNNER_TEMP/build.log"; then
            printf '::error title=Failing tests::%s\n' "$(grep -B2 -A22 'not ok' "$RUNNER_TEMP/build.log" | grep -v 'duration_ms\|^\s*$' | head -c 6000 | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\n/%0A/g')"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rendered-examples
          path: .feedback-workspace/site/_site
      - uses: actions/upload-artifact@v7
        with:
          name: ctm-assessment-package
          path: .feedback-workspace/ctm-assessment.tar.gz
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: .feedback-workspace/site/_site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: ctm-assessment-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy examples
        id: deployment
        uses: actions/deploy-pages@v5
