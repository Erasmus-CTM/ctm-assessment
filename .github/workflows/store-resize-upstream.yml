name: Resize lifecycle upstream controls
on:
  push:
    branches: [consolidation/2026-10-resize-upstream-controls]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: resize-upstream-${{ github.sha }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.8.27'
      - name: Render stock Quarto outside the CTM project
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/resize-stock"
          cp integration/resize-probe/index.qmd "$RUNNER_TEMP/resize-stock/index.qmd"
          cat > "$RUNNER_TEMP/resize-stock/_quarto.yml" <<'YAML'
          project:
            type: website
            render: [index.qmd]
          website:
            title: Resize lifecycle control
          format:
            html:
              toc: false
          YAML
          cd "$RUNNER_TEMP/resize-stock"
          quarto render
      - uses: actions/upload-artifact@v7
        with:
          name: resize-stock-quarto
          path: ${{ runner.temp }}/resize-stock/_site
          retention-days: 7
  controls:
    needs: render
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.1-noble
      options: --user 1001
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify the actual fixture artifact identity
        uses: actions/github-script@v8
        with:
          script: |
            const artifact = (await github.rest.actions.getArtifact({
              owner: context.repo.owner, repo: context.repo.repo, artifact_id: 12452174136
            })).data;
            if (artifact.expired || artifact.name !== 'store-rendered-fixtures' ||
                artifact.workflow_run.head_sha !== '7fa0b25bed9f459c5f18f700f327ad3e804b55cf' ||
                artifact.digest !== 'sha256:41ec55a17c2619ba9fba12fbdde19dbc84d2eb383fffd263f0cbdacc8b94d5f9') {
              throw new Error('Actual fixture artifact changed or expired');
            }
            core.info(JSON.stringify({artifact: artifact.id, digest: artifact.digest,
              head: artifact.workflow_run.head_sha, producerRun: 39841421065}));
      - uses: actions/download-artifact@v7
        with:
          name: store-rendered-fixtures
          run-id: 39841421065
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/resize-fixture
      - uses: actions/download-artifact@v7
        with:
          name: resize-stock-quarto
          path: ${{ runner.temp }}/resize-stock
      - name: Recover the preceding exact diagnostic report
        uses: actions/github-script@v8
        with:
          script: |
            const artifact = (await github.rest.actions.getArtifact({
              owner: context.repo.owner, repo: context.repo.repo, artifact_id: 12460036949
            })).data;
            if (artifact.expired || artifact.name !== 'resize-upstream-webkit' ||
                artifact.workflow_run.head_sha !== 'c14f03f0d1bd2637553effb52cb517de9243f3f4' ||
                artifact.digest !== 'sha256:a8ca489e0063ba5a9b4959dcba840787075b61bf6878c45bbe8adbf11d9de2cd') {
              throw new Error('Preceding diagnostic artifact changed or expired');
            }
      - uses: actions/download-artifact@v7
        with:
          name: resize-upstream-webkit
          run-id: 39857598359
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/resize-previous-report
      - name: Print preceding failed-sample observer traces
        shell: bash
        env:
          CTM_PREVIOUS_REPORT: ${{ runner.temp }}/resize-previous-report
        run: |
          node --input-type=module - "$CTM_PREVIOUS_REPORT" <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          const root=process.argv[2];
          const entries=fs.readdirSync(root,{recursive:true}).filter(name=>name==='report.json'||name.endsWith('/report.json'));
          if(entries.length!==1)throw Error('Expected one exact report');
          const report=JSON.parse(fs.readFileSync(path.join(root,entries[0]),'utf8'));
          console.log(JSON.stringify({precedingSource:report.sourceSha256,summary:report.summary,
            failures:report.samples.filter(sample=>sample.errors.length)},null,2));
          JS
      - name: Probe unchanged upstream and explicit counterfactual controls
        shell: bash
        env:
          CTM_BROWSER: webkit
          CTM_RESIZE_ACTUAL_ONLY: '1'
          CTM_RESIZE_MATH_FRAME_ONLY: '1'
          CTM_RESIZE_STOCK: ${{ runner.temp }}/resize-stock
          CTM_RESIZE_FIXTURE: ${{ runner.temp }}/resize-fixture/before/_site
          CTM_RESIZE_REPORT: ${{ runner.temp }}/resize-report
        run: |
          set -o pipefail
          mkdir -p "$CTM_RESIZE_REPORT"
          node --check integration/resize-probe/probe.mjs
          node integration/resize-probe/probe.mjs 2>&1 | tee "$CTM_RESIZE_REPORT/probe.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: resize-upstream-webkit
          path: ${{ runner.temp }}/resize-report
          retention-days: 7
