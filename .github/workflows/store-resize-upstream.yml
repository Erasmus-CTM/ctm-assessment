name: Resize source phase upstream candidate
on:
  push:
    branches: [consolidation/2026-10-resize-upstream-controls]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: resize-source-phase-${{ github.sha }}
  cancel-in-progress: false
jobs:
  controls:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.1-noble
      options: --user 1001
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify the actual fixture artifact identity
        uses: actions/github-script@v8
        with:
          script: |
            const artifact = (await github.rest.actions.getArtifact({
              owner: context.repo.owner, repo: context.repo.repo, artifact_id: 12452174136
            })).data;
            if (artifact.expired || artifact.name !== 'store-rendered-fixtures' ||
                artifact.workflow_run.head_sha !== '7fa0b25bed9f459c5f18f700f327ad3e804b55cf' ||
                artifact.digest !== 'sha256:41ec55a17c2619ba9fba12fbdde19dbc84d2eb383fffd263f0cbdacc8b94d5f9') {
              throw new Error('Actual fixture artifact changed or expired');
            }
      - uses: actions/download-artifact@v7
        with:
          name: store-rendered-fixtures
          run-id: 39841421065
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/resize-fixture
      - name: Materialize the exact published Monaco package as a matched HTTP input
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/resize-monaco"
          npm pack monaco-editor@0.46.0 --pack-destination "$RUNNER_TEMP/resize-monaco"
          tar -xzf "$RUNNER_TEMP/resize-monaco/monaco-editor-0.46.0.tgz" -C "$RUNNER_TEMP/resize-monaco"
      - name: Verify source semantics and actual browser behavior
        shell: bash
        env:
          CTM_BROWSER: ${{ matrix.browser }}
          CTM_RESIZE_FIXTURE: ${{ runner.temp }}/resize-fixture/before/_site
          CTM_RESIZE_MONACO: ${{ runner.temp }}/resize-monaco/package
          CTM_RESIZE_REPORT: ${{ runner.temp }}/resize-source-phase
        run: |
          set -o pipefail
          mkdir -p "$CTM_RESIZE_REPORT"
          node --test integration/resize-probe/source-phase.test.mjs
          node --check integration/resize-probe/source-phase-browser.mjs
          node integration/resize-probe/source-phase-browser.mjs 2>&1 | tee "$CTM_RESIZE_REPORT/probe.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: resize-source-phase-${{ matrix.browser }}
          path: ${{ runner.temp }}/resize-source-phase
          retention-days: 7
