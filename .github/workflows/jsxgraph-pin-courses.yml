name: JSXGraph pin course and board comparison
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type broad testing campaign to authorize the broad jobs'
        type: string
        required: true

permissions:
  contents: read
  actions: read
jobs:
  campaign:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm the explicitly requested broad campaign
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != 'broad testing campaign' ]; then
            echo '::error::Broad jobs require the exact confirmation: broad testing campaign'
            exit 1
          fi

  compare:
    needs: [campaign]
    strategy:
      fail-fast: false
      matrix:
        include:
          - course: aacchhee/ctm-demo
            course_ref: d65eea624e96bbfc7b65ebb78b7d3a43ebdb3458
            profile: review
          - course: aacchhee/ingmat3a_ntnu
            course_ref: e45851080f462e84cde281528f21d4f21292a6ba
            profile: ''
          - course: examples
            course_ref: ''
            profile: ''
    uses: Erasmus-CTM/ctm-assessment/.github/workflows/compare-courses.yml@72626ab657d9a197e6c965f09119ebc589eb423b
    with:
      tooling-ref: 72626ab657d9a197e6c965f09119ebc589eb423b
      course: ${{ matrix.course }}
      course-ref: ${{ matrix.course_ref }}
      profile: ${{ matrix.profile }}
      base: 68fe838ca76ce7dfc4297f8ed4db1ccf1dc29a8b
      head: ${{ github.sha }}
      browser: true
      browsers: chromium firefox webkit
