name: Step4 preload diagnostic evidence

on:
  pull_request:
    paths:
      - .github/workflows/step4-preload-evidence.yml

permissions:
  contents: read
  actions: read

jobs:
  captured-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: compare-step4-course
          run-id: 39835832179
          github-token: ${{ github.token }}
          path: evidence
      - name: Print existing captured settings differences without rerendering
        run: |
          python - <<'PY'
          import json, pathlib
          reports = sorted(pathlib.Path('evidence').rglob('*.json'))
          assert len(reports) == 1, reports
          path = reports[0]
          assert path.stat().st_size <= 2_000_000
          report = json.loads(path.read_text())
          print(json.dumps({'report': str(path), 'summary': report['summary']}, sort_keys=True))
          rows = [row for row in report['items'] if row.get('object') == 'qpyodideSettings']
          assert 0 < len(rows) <= 100, len(rows)
          for row in rows:
              print('CAPTURED_SETTINGS_DIFF ' + json.dumps(row, sort_keys=True))
          PY
