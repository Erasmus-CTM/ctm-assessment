name: P13 WebKit transport probe
on:
  push:
    branches: [p13/exam-integration]
    paths: [.github/workflows/p13-webkit-network.yml, tools/p13-webkit-network.mjs, tools/p13-local-proxy.mjs]
  pull_request:
    paths: [.github/workflows/p13-webkit-network.yml, tools/p13-webkit-network.mjs, tools/p13-local-proxy.mjs]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  transport:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install webkit
      - name: Probe direct and proxied local origins
        run: node tools/p13-webkit-network.mjs
      - uses: actions/download-artifact@v7
        with:
          name: p13-zip-candidate
          run-id: 40350736282
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/zip
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/checkout@v7
        with:
          repository: Erasmus-CTM/pyodide-interaktiv
          ref: f33425079a70fb5c816d570eb308e71c07cfe888
          path: _p13-ide-source
          persist-credentials: false
      - name: Diagnose the pinned clipboard guard with the prior locked vendor assets
        env:
          P13_BROWSER: webkit
          P13_REPORT: ${{ runner.temp }}/webkit-full-site.json
        run: |
          python -m zipfile -e "$RUNNER_TEMP/zip/python-offline-website.zip" "$RUNNER_TEMP/deployed"
          python - <<'PY'
          import os
          from pathlib import Path
          files=list((Path(os.environ['RUNNER_TEMP'])/'deployed').rglob('qpyodide-cell-classes.js'))
          assert len(files)==1
          files[0].write_bytes(Path('_p13-ide-source/_extensions/pyodide-interaktiv/qpyodide-cell-classes.js').read_bytes())
          PY
          node tools/p13-serve.mjs "$RUNNER_TEMP/deployed" 8765 > "$RUNNER_TEMP/plain.log" 2>&1 &
          node tools/p13-serve.mjs "$RUNNER_TEMP/deployed" 8766 --isolated > "$RUNNER_TEMP/headers.log" 2>&1 &
          curl --noproxy '*' --retry 5 --retry-connrefused --retry-delay 1 --max-time 5 -I http://127.0.0.1:8765/index.html
          node --input-type=module <<'JS'
          import http from 'node:http';import os from 'node:os';
          const lan=Object.values(os.networkInterfaces()).flat().find(x=>x.family==='IPv4'&&!x.internal).address;
          await new Promise(resolve=>{const r=http.get(`http://${lan}:8765/index.html`,res=>{console.log('LAN HTTP server',res.statusCode,res.headers);res.resume();res.on('end',resolve);});r.setTimeout(5000,()=>r.destroy(new Error('LAN server timed out')));r.on('error',e=>{console.log('LAN HTTP server',String(e));resolve();});});
          JS
          node tools/p13-seb-profile.mjs
      - name: Show bounded server diagnostics
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          for name in ['plain.log','headers.log']:
              path=Path(os.environ['RUNNER_TEMP'])/name
              print(name, path.read_text()[:6000] if path.exists() else 'missing')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: p13-webkit-probe
          path: |
            ${{ runner.temp }}/webkit-full-site.json
            ${{ runner.temp }}/plain.log
            ${{ runner.temp }}/headers.log
