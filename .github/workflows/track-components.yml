name: Track component branches

# Early warning, nightly: build and test the combined examples against the
# branch tips named in integration/feedback/repos.json instead of the pinned
# commits, and report component CI pins that differ from repos.json. Never
# deploys and blocks nothing. A failure means the pins cannot be advanced yet.
# A pin that its branch does not contain stays (the log says so): the JSXGraph
# pin is the fork commit of upstream pull request #2, which upstream main lacks.
on:
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type broad testing campaign to authorize the broad jobs'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ctm-assessment-track-components
  cancel-in-progress: true

jobs:
  campaign:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Confirm the explicitly requested broad campaign
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != 'broad testing campaign' ]; then
            echo '::error::Broad jobs require the exact confirmation: broad testing campaign'
            exit 1
          fi

  follow-branches:
    needs: [campaign]
    if: ${{ !cancelled() && (github.event_name == 'schedule' || needs.campaign.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Component CI pins that differ from repos.json (warnings only)
        run: python tools/ci/check-component-pins.py
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install sympy==1.13.3 'networkx>=3.4' 'PyYAML>=6'  # SymPy: the version Pyodide 0.28.3 ships
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.8.27'
      - name: Render and test against component branch tips
        env:
          GITHUB_TOKEN: ${{ github.token }}  # compare API: does a branch contain its pin?
        run: python scripts/setup-feedback-integration.py --follow-branches --test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test all five integration tabs
        env:
          CTM_INTEGRATION_SITE: ${{ github.workspace }}/.feedback-workspace/site/_site
        run: npm run test:browser
      - name: Record resolved branch tips
        if: always()
        run: cat .feedback-workspace/resolved-repos.json || true
