name: Offline asset builder
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  fixture-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile shared builder
        run: python -m py_compile scripts/ctm_assets.py
      - name: Integrity, extraction, licence and carried-bundle contracts
        run: python -m unittest discover -s tests -p 'test_ctm_assets.py' -v
