name: Offline browser checker and mechanism controls
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type broad testing campaign to authorize the broad jobs'
        type: string
        required: true

permissions:
  contents: read
jobs:
  campaign:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm the explicitly requested broad campaign
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != 'broad testing campaign' ]; then
            echo '::error::Broad jobs require the exact confirmation: broad testing campaign'
            exit 1
          fi

  controls:
    needs: [campaign]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: Erasmus-CTM/ctm-assessment
          # Exact reviewed server head from merged PR27; dependency pins use reviewed heads.
          ref: 7b1903d1c4f4b2fcf0cc29f2773c9d2857144cf9
          path: server-source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Install full Chromium (headless shell is not mechanism evidence)
        run: npx playwright install --with-deps chromium
      - name: Prepare local real JSXGraph fixture
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/offline-jxg"
          npm view jsxgraph@1.14.2 dist.integrity --registry=https://registry.npmjs.org > "$RUNNER_TEMP/offline-jxg/integrity.txt"
          npm pack jsxgraph@1.14.2 --registry=https://registry.npmjs.org --pack-destination "$RUNNER_TEMP/offline-jxg" --json > "$RUNNER_TEMP/offline-jxg/package.json"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import path from 'node:path';
          const dir = path.join(process.env.RUNNER_TEMP, 'offline-jxg');
          const metadata = JSON.parse(fs.readFileSync(path.join(dir, 'package.json'), 'utf8'))[0];
          const expected = fs.readFileSync(path.join(dir, 'integrity.txt'), 'utf8').trim();
          const actual = 'sha512-' + crypto.createHash('sha512').update(fs.readFileSync(path.join(dir, metadata.filename))).digest('base64');
          if (metadata.version !== '1.14.2' || actual !== expected || metadata.integrity !== expected) throw new Error('fixture package integrity mismatch');
          console.log(JSON.stringify({version: metadata.version, integrity: actual}));
          JS
          tar -xzf "$RUNNER_TEMP/offline-jxg/jsxgraph-1.14.2.tgz" -C "$RUNNER_TEMP/offline-jxg"
      - name: Run positive, negative and real hidden-frame controls
        env:
          CTM_OFFLINE_SERVER: server-source/scripts/serve-offline.py
          JXG_FIXTURE_DIR: ${{ runner.temp }}/offline-jxg/package/distrib
          CTM_OFFLINE_REPORT: offline-browser-report.json
        run: node --test tests/offline-check.test.mjs
      - name: Record observed evidence summary
        if: always()
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          if (!fs.existsSync('offline-browser-report.json')) {
            console.log('::warning::No browser report; no execution evidence is claimed');
          } else {
            const report = JSON.parse(fs.readFileSync('offline-browser-report.json', 'utf8'));
            const observed = {scope: report.scope, browser: report.browserVersion,
              courseRegression: report.courseRegression, forkPR2: report.forkPR2,
              contracts: report.contracts.map(contract => ({scope: contract.scope,
                path: contract.results[0]?.path, loads: contract.results.length,
                accepted: contract.results.filter(load => load.ok).length,
                boardChecks: contract.results.reduce((n, load) => n + load.boards.length, 0)})),
              mechanism: Object.fromEntries(Object.entries(report.mechanism?.modes || {})
                .map(([mode, loads]) => [mode, {loads: loads.length, blanks: loads.filter(load => load.blank).length}]))};
            const text = JSON.stringify(observed);
            console.log('::notice title=Offline browser observed evidence::' + text);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'Observed evidence (test conclusions remain authoritative):\n\n~~~json\n' +
              JSON.stringify(observed, null, 2) + '\n~~~\n');
          }
          JS
      - name: Upload exact evidence even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: offline-browser-controls-${{ github.sha }}
          path: offline-browser-report.json
          if-no-files-found: warn
