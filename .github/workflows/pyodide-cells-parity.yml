name: Pyodide cells, old against new

# T13 (consolidation step 3, design docs/consolidation/2026-10-step3.md §18.7):
# every Pyodide cell of a course, run in Chromium with the package of two
# ctm-assessment refs (tools/pyodide-cells.mjs): the old build twice (cells
# whose output differs between those runs are compared for errors only), the
# new build once; startup and autorun cells first, then every interactive
# cell in page order. Any other difference fails. Also the example site's
# cells in Firefox and WebKit against Chromium (module workers, Atomics.wait
# and COEP credentialless differ between the engines).
#
# On pull requests that change the pins or the tool: ctm-demo and ingmat3a
# (main), old = the pull request's base, new = its head; ingmat3a's
# linalg-branch is informational (a warning, never a failure). On demand: any
# course, course ref and package refs.
on:
  workflow_dispatch:
    inputs:
      course:
        description: 'Course repository (owner/name)'
        default: 'aacchhee/ingmat3a_ntnu'
      course-ref:
        description: 'Course branch, tag or commit'
        default: 'main'
      old:
        description: 'ctm-assessment ref of the old package'
        default: 'main'
      new:
        description: 'ctm-assessment ref of the new package (empty: the branch this runs on)'
        default: ''
  pull_request:
    paths:
      - integration/feedback/repos.json
      - tools/pyodide-cells.mjs
      - .github/workflows/pyodide-cells-parity.yml

permissions:
  contents: read

concurrency:
  group: pyodide-cells-${{ github.ref }}-${{ inputs.course }}-${{ inputs['course-ref'] }}
  cancel-in-progress: true

jobs:
  courses:
    name: cells ${{ matrix.course }} @ ${{ matrix.ref }}${{ matrix.informational && ' (informational)' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('[{{"course":"{0}","ref":"{1}","informational":false}}]', inputs.course, inputs['course-ref']) || '[{"course":"aacchhee/ctm-demo","ref":"main","informational":false},{"course":"aacchhee/ingmat3a_ntnu","ref":"main","informational":false},{"course":"aacchhee/ingmat3a_ntnu","ref":"linalg-branch","informational":true}]') }}
    env:
      COURSE: ${{ matrix.course }}
      COURSE_REF: ${{ matrix.ref }}
      OLD: ${{ inputs.old || github.event.pull_request.base.sha || 'main' }}
      NEW: ${{ inputs.new || github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install sympy==1.13.3 'networkx>=3.4' 'PyYAML>=6' jupyter nbformat
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.8.27'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Build the course with the old and the new package
        id: build
        continue-on-error: ${{ matrix.informational == true }}
        run: |
          set -e
          if ! git ls-remote --exit-code "https://github.com/$COURSE.git" "$COURSE_REF" >/dev/null; then
            echo "::notice title=Skipped::$COURSE has no ref $COURSE_REF"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          for side in old new; do
            ref=$OLD; [ "$side" = new ] && ref=$NEW
            git init -q "$RUNNER_TEMP/$side"
            git -C "$RUNNER_TEMP/$side" fetch -q --depth 1 "https://github.com/${{ github.repository }}.git" "$ref"
            git -C "$RUNNER_TEMP/$side" checkout -q --detach FETCH_HEAD
            echo "$side: ctm-assessment $ref = $(git -C "$RUNNER_TEMP/$side" rev-parse HEAD)"
            python scripts/build-course.py --umbrella "$RUNNER_TEMP/$side" --repo "https://github.com/$COURSE.git" --ref "$COURSE_REF" \
              --dest "$RUNNER_TEMP/out/$side" --workspace "$RUNNER_TEMP/ws-$side"
          done
      - name: Run every cell (old twice, new once)
        id: run
        if: steps.build.outcome == 'success' && steps.build.outputs.skip != 'true'
        continue-on-error: ${{ matrix.informational == true }}
        run: |
          mkdir -p "$RUNNER_TEMP/cells"
          node tools/pyodide-cells.mjs run --site "$RUNNER_TEMP/out/old/_site" --out "$RUNNER_TEMP/cells/old.json" --runs 2
          node tools/pyodide-cells.mjs run --site "$RUNNER_TEMP/out/new/_site" --out "$RUNNER_TEMP/cells/new.json" --runs 1
      - name: Compare
        id: compare
        if: steps.run.outcome == 'success'
        continue-on-error: ${{ matrix.informational == true }}
        run: node tools/pyodide-cells.mjs compare --old "$RUNNER_TEMP/cells/old.json" --new "$RUNNER_TEMP/cells/new.json" --summary "$RUNNER_TEMP/cells/summary.md" --name "$COURSE@$COURSE_REF ($OLD -> $NEW)"
      - name: Report the result as an annotation
        if: always()
        env:
          INFORMATIONAL: ${{ matrix.informational == true }}
          OUTCOMES: build ${{ steps.build.outcome }}, run ${{ steps.run.outcome }}, comparison ${{ steps.compare.outcome }}
        run: |
          text=$(head -c 6000 "$RUNNER_TEMP/cells/summary.md" 2>/dev/null || echo "no comparison ($OUTCOMES)")
          level=notice; [ "${{ job.status }}" = success ] || level=error
          if [ "$INFORMATIONAL" = true ] && ! grep -q ', 0 unexplained' <<<"$text"; then level=warning; text="Informational: $OUTCOMES."$'\n'"$text"; fi
          printf '::%s title=Pyodide cells %s::%s\n' "$level" "$COURSE@$COURSE_REF" "$(printf '%s' "$text" | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\n/%0A/g')"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pyodide-cells-${{ strategy.job-index }}
          path: ${{ runner.temp }}/cells

  engines:
    name: example cells in Firefox and WebKit against Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.new || github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install sympy==1.13.3 'networkx>=3.4' 'PyYAML>=6'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.8.27'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Build the example site
        run: python scripts/setup-feedback-integration.py
      - name: Run its cells in each engine and compare with Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/cells"
          site=.feedback-workspace/site/_site
          node tools/pyodide-cells.mjs run --site "$site" --out "$RUNNER_TEMP/cells/chromium.json" --runs 2 --browser chromium
          status=0
          for engine in firefox webkit; do
            # WebKit has no COEP credentialless: served as GitHub Pages serves it (no isolation, no service worker).
            isolate=yes; [ "$engine" = webkit ] && isolate=no
            node tools/pyodide-cells.mjs run --site "$site" --out "$RUNNER_TEMP/cells/$engine.json" --runs 1 --browser $engine --isolate $isolate
            node tools/pyodide-cells.mjs compare --old "$RUNNER_TEMP/cells/chromium.json" --new "$RUNNER_TEMP/cells/$engine.json" \
              --summary "$RUNNER_TEMP/cells/$engine.md" --name "examples, $engine against chromium" --page-errors report || status=1
          done
          exit $status
      - name: Report the result as an annotation
        if: always()
        run: |
          text=$(cat "$RUNNER_TEMP"/cells/*.md 2>/dev/null | head -c 6000 || echo 'no report')
          level=notice; [ "${{ job.status }}" = success ] || level=error
          printf '::%s title=Pyodide cells in Firefox and WebKit::%s\n' "$level" "$(printf '%s' "$text" | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\n/%0A/g')"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pyodide-cells-engines
          path: ${{ runner.temp }}/cells
