name: Store comparator regression tests
on:
  push:
    branches: [consolidation/2026-10-store-comparison-checkpoint]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/compare-rendered.test.cjs tests/compare-rendered-store.test.cjs
