name: Compare rendered courses

# Builds a course (or the umbrella's example site, course "examples") with two
# ctm-assessment refs, each through its own installer and pins
# (scripts/build-course.py), and compares the rendered pages
# (tools/compare-rendered.mjs). Every difference must belong to an expected
# category of tools/compare-rendered/expect/ (step1.yml and the course's own
# file); the report is uploaded. On demand for any course and refs, and on
# pull requests that change the package, its pins or the tool (the example
# site, ctm-demo with its STACK review build, ingmat3a; before = the pull
# request's base, after = its head).
on:
  workflow_dispatch:
    inputs:
      course:
        description: 'Course repository (owner/name), or "examples" for the umbrella example site'
        default: 'aacchhee/ctm-demo'
      course-ref:
        description: 'Course branch, tag or full commit SHA'
        default: 'main'
      profile:
        description: 'Quarto profile rendered and compared as well (for example review), or empty'
        default: ''
      base:
        description: 'ctm-assessment ref built as "before"'
        default: 'main'
      head:
        description: 'ctm-assessment ref built as "after" (empty: the branch this runs on)'
        default: ''
  pull_request:
    paths:
      - integration/feedback/repos.json
      - _extensions/**
      - _filters/**
      - examples/**
      - example.qmd
      - feedback/**
      - scripts/install-project.py
      - scripts/setup-feedback-integration.py
      - scripts/build-course.py
      - tools/**
      - .github/workflows/compare-courses.yml

permissions:
  contents: read

concurrency:
  group: compare-courses-${{ github.ref }}-${{ inputs.course || 'pr' }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('[{{"course":"{0}","ref":"{1}","profile":"{2}"}}]', inputs.course, inputs['course-ref'], inputs.profile) || '[{"course":"examples","ref":"","profile":""},{"course":"aacchhee/ctm-demo","ref":"main","profile":"review"},{"course":"aacchhee/ingmat3a_ntnu","ref":"main","profile":""}]') }}
    env:
      BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.base || 'main' }}
      AFTER: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.head || github.sha }}
      COURSE: ${{ matrix.course }}
      COURSE_REF: ${{ matrix.ref }}
      PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v7
      - name: Check out ctm-assessment before and after
        run: |
          for side in before after; do
            ref=$BASE; [ "$side" = after ] && ref=$AFTER
            git init -q "$RUNNER_TEMP/$side"
            git -C "$RUNNER_TEMP/$side" fetch -q --depth 1 "https://github.com/${{ github.repository }}.git" "$ref"
            git -C "$RUNNER_TEMP/$side" checkout -q --detach FETCH_HEAD
            echo "$side: $ref = $(git -C "$RUNNER_TEMP/$side" rev-parse HEAD), CTM Assessment $(sed -n 's/^version: *//p' "$RUNNER_TEMP/$side/_extensions/ctm-assessment/_extension.yml")"
          done
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # SymPy: the version Pyodide ships (native build-time checks); Jupyter as the courses' builds install it.
      - run: python -m pip install sympy==1.13.3 'networkx>=3.4' 'PyYAML>=6' jupyter nbformat
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.8.27'
      - run: npm ci --ignore-scripts
      - name: Build ${{ matrix.course }} with both refs
        run: |
          set -e
          for side in before after; do
            out="$RUNNER_TEMP/out/$side"
            if [ "$COURSE" = examples ]; then
              python "$RUNNER_TEMP/$side/scripts/setup-feedback-integration.py" --workspace "$RUNNER_TEMP/ws-$side"
              mkdir -p "$out" && cp -r "$RUNNER_TEMP/ws-$side/site/_site" "$out/_site"
            else
              python scripts/build-course.py --umbrella "$RUNNER_TEMP/$side" --repo "https://github.com/$COURSE.git" --ref "$COURSE_REF" \
                --dest "$out" --workspace "$RUNNER_TEMP/ws-$side"
              if [ -n "$PROFILE" ]; then (cd "$out" && quarto render --profile "$PROFILE"); fi
            fi
          done
      - name: Compare the rendered pages
        run: |
          name=$(basename "$COURSE")
          expect=(--expect tools/compare-rendered/expect/step1.yml)
          [ -f "tools/compare-rendered/expect/$name.yml" ] && expect+=(--expect "tools/compare-rendered/expect/$name.yml")
          outputs=(_site)
          if [ -n "$PROFILE" ] && [ -f "$RUNNER_TEMP/out/after/_quarto-$PROFILE.yml" ]; then
            dir=$(python -c "import sys, yaml; print(((yaml.safe_load(open(sys.argv[1])) or {}).get('project') or {}).get('output-dir') or '')" "$RUNNER_TEMP/out/after/_quarto-$PROFILE.yml")
            [ -n "$dir" ] && [ "$dir" != _site ] && outputs+=("$dir")
          fi
          mkdir -p "$RUNNER_TEMP/reports"
          status=0
          for output in "${outputs[@]}"; do
            node tools/compare-rendered.mjs --before "$RUNNER_TEMP/out/before/$output" --after "$RUNNER_TEMP/out/after/$output" "${expect[@]}" \
              --name "$COURSE $output ($BASE -> $AFTER)" --report "$RUNNER_TEMP/reports/$name$output.json" --summary "$RUNNER_TEMP/reports/$name$output.md" || status=1
          done
          cat "$RUNNER_TEMP"/reports/*.md
          exit $status
      - name: Report the result as an annotation
        if: always()
        run: |
          text=$(cat "$RUNNER_TEMP"/reports/*.md 2>/dev/null | head -c 6000 || echo 'no report')
          level=notice; [ "${{ job.status }}" = success ] || level=error
          printf '::%s title=Compare %s::%s\n' "$level" "$COURSE" "$(printf '%s' "$text" | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\n/%0A/g')"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compare-${{ strategy.job-index }}
          path: ${{ runner.temp }}/reports
