name: Complete asset lock composition contracts
on:
  # Pull requests and main; a branch push without a pull request runs nothing.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ctm-assets-compose-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Complete materialization, private evidence and adversarial controls
        run: python -m unittest discover -s tests -p 'test_assets_composition.py' -v
      - name: Preserve core npm selection and carried contracts
        run: python -m unittest discover -s tests -p 'test_assets_npm_lock.py' -v
