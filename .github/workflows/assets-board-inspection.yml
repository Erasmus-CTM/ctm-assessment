name: Board asset archive inspection
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type broad testing campaign to authorize the broad jobs'
        type: string
        required: true

permissions:
  contents: read
jobs:
  campaign:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm the explicitly requested broad campaign
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != 'broad testing campaign' ]; then
            echo '::error::Broad jobs require the exact confirmation: broad testing campaign'
            exit 1
          fi

  official-archives:
    needs: [campaign]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/cache@v6
        with:
          path: .asset-cache/boards
          key: ctm-board-archives-${{ hashFiles('integration/assets-board-metadata.json') }}
      - run: python -m pip install fonttools brotli
      - name: Inspect official integrity-verified board archives
        run: |
          python - <<'PY'
          import base64, collections, importlib.util, json, pathlib
          spec = importlib.util.spec_from_file_location('assets', 'scripts/ctm_assets.py')
          assets = importlib.util.module_from_spec(spec); spec.loader.exec_module(assets)
          metadata = json.loads(pathlib.Path('integration/assets-board-metadata.json').read_text())
          wanted = {'jsxgraph', 'mathjax4', 'mathjax-newcm-font'}
          metadata['archives'] = [entry for entry in metadata['archives'] if entry['id'] in wanted]
          assert {entry['id'] for entry in metadata['archives']} == wanted
          inspection = assets.inspect_archives(metadata, pathlib.Path('.asset-cache/boards'))
          output = pathlib.Path('.private-extensions/board-inspection.json')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_bytes(assets.json_bytes(inspection))
          review = {'archives': []}
          for archive in inspection['archives']:
              review['archives'].append({key: archive[key] for key in ('id', 'version', 'npm', 'integrity', 'texts')} | {
                  'count': len(archive['members']),
                  'directories': dict(collections.Counter('/'.join(member['member'].split('/')[:3]) for member in archive['members'])),
                  'root_members': [member['member'] for member in archive['members'] if member['member'].count('/') == 1]})
          raw = assets.json_bytes(review)
          print('CTM_BOARD_INSPECTION ' + json.dumps({'bytes': len(raw), 'git_blob_sha1': assets.git_blob_sha1(raw), 'sha256': assets.digest(raw)}))
          encoded = base64.b64encode(raw).decode()
          for i in range(0, len(encoded), 3000):
              print('CTM_BOARD_INSPECTION ' + json.dumps({'chunk': i // 3000, 'base64': encoded[i:i+3000]}))
          print('CTM_BOARD_INSPECTION ' + json.dumps({'complete': True}))
          PY
      - name: Inspect the actual font copyright and licence records
        run: |
          python - <<'PY'
          import base64, collections, importlib.util, io, json, pathlib, tarfile
          from fontTools.ttLib import TTFont
          spec = importlib.util.spec_from_file_location('assets', 'scripts/ctm_assets.py')
          assets = importlib.util.module_from_spec(spec); spec.loader.exec_module(assets)
          metadata = json.loads(pathlib.Path('integration/assets-board-metadata.json').read_text())
          entry, = [item for item in metadata['archives'] if item['id'] == 'mathjax-newcm-font']
          cache = pathlib.Path('.asset-cache/boards')
          archive = cache / ('archive-' + assets.digest(assets.json_bytes({key: entry.get(key) for key in ('url', 'sha256', 'integrity')})))
          assets.download(entry['url'], archive, integrity=entry['integrity'])
          fonts, definitions = [], {}
          with tarfile.open(archive, 'r|*') as source:
              for member in source:
                  if not member.isfile():
                      continue
                  if member.name.endswith('.woff2') or member.name == 'package/def/mathjax-newcm.ts':
                      data = source.extractfile(member).read()
                      if member.name.endswith('.woff2'):
                          font = TTFont(io.BytesIO(data))
                          names = {str(key): sorted({record.toUnicode() for record in font['name'].names if record.nameID == key}) for key in (0, 1, 2, 5, 13, 14)}
                          fonts.append({'member': member.name, 'sha256': assets.digest(data), 'names': names})
                          font.close()
                      else:
                          definitions[member.name] = {'sha256': assets.digest(data), 'text': data.decode('utf-8')}
          assert fonts
          result = {'source': entry, 'fonts': fonts, 'definitions': definitions}
          raw = assets.json_bytes(result)
          pathlib.Path('.private-extensions/board-font-records.json').write_bytes(raw)
          print('CTM_BOARD_FONT ' + json.dumps({'bytes': len(raw), 'sha256': assets.digest(raw), 'git_blob_sha1': assets.git_blob_sha1(raw)}))
          encoded = base64.b64encode(raw).decode()
          for i in range(0, len(encoded), 3000):
              print('CTM_BOARD_FONT ' + json.dumps({'chunk': i // 3000, 'base64': encoded[i:i+3000]}))
          print('CTM_BOARD_FONT ' + json.dumps({'complete': True}))
          PY
      - name: Preserve primary GUST and incorporated LPPL licence texts
        run: |
          python - <<'PY'
          import base64, importlib.util, json, pathlib, urllib.parse, urllib.request
          spec = importlib.util.spec_from_file_location('assets', 'scripts/ctm_assets.py')
          assets = importlib.util.module_from_spec(spec); spec.loader.exec_module(assets)
          sources = {
              'gust-font-license.txt': 'https://tug.org/fonts/licenses/GUST-FONT-LICENSE.txt',
              'lppl-1.3c.txt': 'https://www.latex-project.org/lppl/lppl-1-3c.txt'}
          records = {}
          for name, url in sources.items():
              request = urllib.request.Request(url, headers={'User-Agent': 'CTM-License-Review/1'})
              with urllib.request.urlopen(request, timeout=120) as response:
                  final = response.geturl()
                  assert urllib.parse.urlsplit(final).scheme == 'https'
                  assert urllib.parse.urlsplit(final).hostname in {'tug.org', 'www.tug.org', 'www.latex-project.org', 'latex-project.org'}
                  data = response.read()
              assert data and not data.lstrip().startswith(b'<')
              records[name] = {'source': url, 'resolved_source': final, 'bytes': len(data),
                               'sha256': assets.digest(data), 'git_blob_sha1': assets.git_blob_sha1(data),
                               'base64': base64.b64encode(data).decode()}
          raw = assets.json_bytes(records)
          pathlib.Path('.private-extensions/board-primary-licences.json').write_bytes(raw)
          encoded = base64.b64encode(raw).decode()
          print('CTM_BOARD_LICENCES ' + json.dumps({'bytes': len(raw), 'sha256': assets.digest(raw), 'git_blob_sha1': assets.git_blob_sha1(raw)}))
          for i in range(0, len(encoded), 3000):
              print('CTM_BOARD_LICENCES ' + json.dumps({'chunk': i // 3000, 'base64': encoded[i:i+3000]}))
          print('CTM_BOARD_LICENCES ' + json.dumps({'complete': True}))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: verified-board-archive-inspection
          path: |
            .private-extensions/board-inspection.json
            .private-extensions/board-font-records.json
            .private-extensions/board-primary-licences.json
