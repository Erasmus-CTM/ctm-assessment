name: Pyodide parity and goldens

# The parity harness (integration/pyodide-parity) over the example site,
# math-exercise's example site and the courses of corpora.json (the one course
# list) with a pinned commit (ctm-demo and ingmat3a):
# - parity: every exercise graded under Pyodide 0.27.2 and 0.28.3 (D4 gate;
#   any difference in status or score fails), with the golden capture for
#   ctm-checkers (step-2 design §6, §13): artifact goldens-export (the rows
#   ctm-checkers may commit: math-exercise's own examples) and goldens-umbrella
#   (rows from the courses and the umbrella's examples, which stay here).
#   The capture runs with PYTHONHASHSEED 0 and is repeated with seed 1 for
#   the umbrella's and math-exercise's corpora: any row that differs fails.
# - builds (L2): the same corpora built with the explicit base and dispatched
#   commit, graded under 0.28.3; any difference (status, score, details,
#   feedback, cases) fails unless the reviewed expected-file input lists it.
# Either job fails when a case has no result, times out or ends in a harness
# error, or when a teacher answer (answers.json) gets another verdict.
# - following (informational, never fails): the courses that follow a branch
#   (ingmat3a's linalg-branch at its tip; skipped with a notice once the branch
#   is gone) graded the same way, and on pull requests compared with the base;
#   a problem there is a warning, so work in progress on a course branch never
#   turns main or a pull request red (round-2 review N1).
# Only on an explicitly confirmed broad campaign, with frozen package and
# course refs. Automatic campaigns and the weekly schedule are disabled.
# Broad campaigns remain explicit; the focused prerequisite closure has its own gate.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type broad testing campaign to authorize the broad jobs'
        type: string
        required: true
      courses:
        description: 'Other course commits, as NAME=COMMIT separated by spaces (names from corpora.json, e.g. ingmat3a=d7ddfc6); empty: as corpora.json says'
        default: ''
      base:
        description: 'Umbrella commit, tag or branch built as the base of the build comparison (a branch means origin/<branch>; empty: no comparison)'
        default: ''
      expected:
        description: 'Reviewed integration/pyodide-parity/expected/*.json file, or empty for no expected differences'
        default: ''


permissions:
  contents: read

# The weekly run and runs on demand have groups of their own: a push to main
# does not cancel them, nor they it.
concurrency:
  group: ctm-assessment-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

env:
  # NAME=COMMIT words, checked by the first step of each job.
  COURSES: ${{ github.event.inputs.courses }}

jobs:
  campaign:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm the explicitly requested broad campaign
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != 'broad testing campaign' ]; then
            echo '::error::Broad jobs require the exact confirmation: broad testing campaign'
            exit 1
          fi

  parity:
    needs: [campaign]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Check the inputs of a run on demand
        if: github.event_name == 'workflow_dispatch'
        env:
          BASE: ${{ github.event.inputs.base }}
        run: |
          for course in $COURSES; do
            [[ "$course" =~ ^[a-z0-9][a-z0-9-]*=[0-9a-f]{7,40}$ ]] || { echo "::error::courses takes NAME=COMMIT (7 to 40 hex digits): $course"; exit 1; }
          done
          [ -z "$BASE" ] || [[ "$BASE" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] || { echo "::error::base is a commit, tag or branch name: $BASE"; exit 1; }
      - name: Select explicit review dependencies (main keeps normal defaults)
        env:
          REVIEW_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/ci/review-dependencies.py
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            integration/pyodide-parity/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # SymPy: the version Pyodide ships (native build-time checks); Jupyter as the courses' builds install it.
      - run: python -m pip install sympy==1.13.3 'networkx>=3.4' 'PyYAML>=6' jupyter nbformat
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.8.27'
      - name: Build the corpora with the package
        run: |
          refs=(); for course in $COURSES; do refs+=(--ref "$course"); done
          python integration/pyodide-parity/build-corpora.py --courses pinned --umbrella . --out "$RUNNER_TEMP/corpora" --review-refs "$CTM_REVIEW_REFS" "${refs[@]}"
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts
        working-directory: integration/pyodide-parity
      - name: Grade every exercise under Pyodide 0.27.2 and 0.28.3, and capture the goldens
        run: |
          set -o pipefail
          c="$RUNNER_TEMP/corpora"
          node integration/pyodide-parity/run.cjs --corpora "$c/corpora-built.json" \
            --out "$RUNNER_TEMP/parity" --capture "$RUNNER_TEMP/goldens" 2>&1 | tee "$RUNNER_TEMP/parity.log"
      - name: Capture the umbrella's and math-exercise's corpora again with PYTHONHASHSEED 1; every row must be the same
        run: |
          c="$RUNNER_TEMP/corpora"
          node integration/pyodide-parity/run.cjs --hash-seed 1 \
            --site umbrella="$c/ws/site/_site" --site math-exercise="$c/sites/math-exercise/_site" \
            --sources umbrella=. --sources math-exercise="$c/sites/math-exercise" \
            --extensions "$c/ws/site/_extensions" --out "$RUNNER_TEMP/parity-seed1" --capture "$RUNNER_TEMP/goldens-seed1" \
            > "$RUNNER_TEMP/parity-seed1.log" 2>&1 || { tail -80 "$RUNNER_TEMP/parity-seed1.log"; exit 1; }
          cd "$RUNNER_TEMP/goldens-seed1"
          files=$(find export umbrella -name '*.jsonl' | sort)
          status=0
          for f in $files; do
            if ! cmp -s "$f" "$RUNNER_TEMP/goldens/$f"; then
              echo "::error title=Golden capture depends on PYTHONHASHSEED::$f"
              diff "$RUNNER_TEMP/goldens/$f" "$f" | head -20 || true
              status=1
            fi
          done
          echo "$(echo "$files" | wc -w) files compared with the capture under PYTHONHASHSEED 0"
          exit $status
      - name: Report the result as an annotation
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/parity/report.md" ]; then text=$(head -c 6000 "$RUNNER_TEMP/parity/report.md"); else text=$(tail -40 "$RUNNER_TEMP/parity.log" 2>/dev/null || echo 'no output'); fi
          level=notice; [ "${{ job.status }}" = success ] || level=error
          printf '::%s title=Pyodide parity::%s\n' "$level" "$(printf '%s' "$text" | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\n/%0A/g')"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pyodide-parity
          path: |
            ${{ runner.temp }}/parity/report.*
            ${{ runner.temp }}/parity/results-*.jsonl
            ${{ runner.temp }}/parity/job-*.json
      # export/ holds its own manifest and notice: nothing of the umbrella's side.
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: goldens-export
          path: ${{ runner.temp }}/goldens/export
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: goldens-umbrella
          path: |
            ${{ runner.temp }}/goldens/umbrella
            ${{ runner.temp }}/goldens/manifest.json
            ${{ runner.temp }}/goldens/PROVENANCE.md

  builds:
    needs: [campaign]
    if: inputs.base != ''
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the inputs of a run on demand
        if: github.event_name == 'workflow_dispatch'
        env:
          BASE: ${{ github.event.inputs.base }}
        run: |
          for course in $COURSES; do
            [[ "$course" =~ ^[a-z0-9][a-z0-9-]*=[0-9a-f]{7,40}$ ]] || { echo "::error::courses takes NAME=COMMIT (7 to 40 hex digits): $course"; exit 1; }
          done
          [ -z "$BASE" ] || [[ "$BASE" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] || { echo "::error::base is a commit, tag or branch name: $BASE"; exit 1; }
      - name: Select explicit review dependencies (main keeps normal defaults)
        env:
          REVIEW_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/ci/review-dependencies.py
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            integration/pyodide-parity/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install sympy==1.13.3 'networkx>=3.4' 'PyYAML>=6' jupyter nbformat
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.8.27'
      - name: Build the corpora with the base and with this commit
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.inputs.base }}
        run: |
          set -e
          # A commit or tag as it is; a branch name as fetched (origin/<branch>).
          ref="$BASE"
          git rev-parse --verify --quiet "$ref^{commit}" > /dev/null || ref="origin/$BASE"
          git rev-parse --verify "$ref^{commit}"
          git worktree add --detach "$RUNNER_TEMP/base-umbrella" "$ref"
          # The base keeps its own pins; review refs belong to this commit only.
          # One set of course commits for both builds.
          refs=(); for course in $COURSES; do refs+=(--ref "$course"); done
          python integration/pyodide-parity/build-corpora.py --courses pinned --resolve "$RUNNER_TEMP/course-commits.json" "${refs[@]}"
          python integration/pyodide-parity/build-corpora.py --courses pinned --umbrella "$RUNNER_TEMP/base-umbrella" --out "$RUNNER_TEMP/builds/base" --refs "$RUNNER_TEMP/course-commits.json"
          python integration/pyodide-parity/build-corpora.py --courses pinned --umbrella . --out "$RUNNER_TEMP/builds/head" --review-refs "$CTM_REVIEW_REFS" --refs "$RUNNER_TEMP/course-commits.json"
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts
        working-directory: integration/pyodide-parity
      - name: Exercise real materialized triangle fixtures and negative coverage canaries
        env:
          CTM_PARITY_VARIANT_BUILD: ${{ runner.temp }}/builds/head
        run: node --test tests/parity-variants.test.cjs tests/parity-stack-h1.test.cjs
      - name: Grade every exercise of both builds under Pyodide 0.28.3
        env:
          # The differences this pull request causes on purpose, if any (docs/development.md).
          EXPECTED: ${{ inputs.expected }}
        run: |
          set -o pipefail
          expected=()
          if [ -n "$EXPECTED" ] && [ ! -f "$EXPECTED" ]; then echo "::error::Expected-difference file does not exist: $EXPECTED"; exit 1; fi
          if [ -n "$EXPECTED" ] && [ -f "$EXPECTED" ]; then expected=(--expected "$EXPECTED"); echo "Expected differences: $EXPECTED"; fi
          node integration/pyodide-parity/run.cjs --builds base="$RUNNER_TEMP/builds/base",head="$RUNNER_TEMP/builds/head" "${expected[@]}" \
            --corpora corpora-built.json --out "$RUNNER_TEMP/builds-report" 2>&1 | tee "$RUNNER_TEMP/builds.log"
      - name: Report the result as an annotation
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/builds-report/report.md" ]; then text=$(head -c 6000 "$RUNNER_TEMP/builds-report/report.md"); else text=$(tail -40 "$RUNNER_TEMP/builds.log" 2>/dev/null || echo 'no output'); fi
          level=notice; [ "${{ job.status }}" = success ] || level=error
          printf '::%s title=Build comparison::%s\n' "$level" "$(printf '%s' "$text" | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\n/%0A/g')"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: build-comparison
          path: |
            ${{ runner.temp }}/builds-report/report.*
            ${{ runner.temp }}/builds-report/results-*.jsonl

  following:
    needs: [campaign]
    name: following (courses that follow a branch; informational)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the inputs of a run on demand
        if: github.event_name == 'workflow_dispatch'
        run: |
          for course in $COURSES; do
            [[ "$course" =~ ^[a-z0-9][a-z0-9-]*=[0-9a-f]{7,40}$ ]] || { echo "::error::courses takes NAME=COMMIT (7 to 40 hex digits): $course"; exit 1; }
          done
      - name: Select explicit review dependencies (main keeps normal defaults)
        env:
          REVIEW_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/ci/review-dependencies.py
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            integration/pyodide-parity/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install sympy==1.13.3 'networkx>=3.4' 'PyYAML>=6' jupyter nbformat
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.8.27'
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts
        working-directory: integration/pyodide-parity
      # Every step that can fail on the course branch's own work continues; the last step reports.
      - name: Build the courses that follow a branch (on pull requests also with the base)
        id: build
        continue-on-error: true
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -e
          refs=(); for course in $COURSES; do refs+=(--ref "$course"); done
          python integration/pyodide-parity/build-corpora.py --courses following --resolve "$RUNNER_TEMP/following-commits.json" "${refs[@]}"
          python integration/pyodide-parity/build-corpora.py --courses following --umbrella . --out "$RUNNER_TEMP/following/head" --review-refs "$CTM_REVIEW_REFS" --refs "$RUNNER_TEMP/following-commits.json"
          if [ -n "$BASE" ]; then
            git worktree add --detach "$RUNNER_TEMP/base-umbrella" "$BASE"
            python integration/pyodide-parity/build-corpora.py --courses following --umbrella "$RUNNER_TEMP/base-umbrella" --out "$RUNNER_TEMP/following/base" --refs "$RUNNER_TEMP/following-commits.json"
          fi
      - name: Grade them under Pyodide 0.27.2 and 0.28.3
        id: parity
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          node integration/pyodide-parity/run.cjs --corpora "$RUNNER_TEMP/following/head/corpora-built.json" --out "$RUNNER_TEMP/following-parity" 2>&1 | tee "$RUNNER_TEMP/following-parity.log"
      - name: Compare the base build with this one under Pyodide 0.28.3
        id: builds
        if: steps.build.outcome == 'success' && github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          set -o pipefail
          node integration/pyodide-parity/run.cjs --builds base="$RUNNER_TEMP/following/base",head="$RUNNER_TEMP/following/head" \
            --corpora corpora-built.json --out "$RUNNER_TEMP/following-builds" 2>&1 | tee "$RUNNER_TEMP/following-builds.log"
      - name: Report the result (a warning, never a failure)
        if: always()
        env:
          BUILD: ${{ steps.build.outcome }}
          PARITY: ${{ steps.parity.outcome }}
          BUILDS: ${{ steps.builds.outcome }}
        run: |
          commits=$(cat "$RUNNER_TEMP/following-commits.json" 2>/dev/null | tr -d '\n ' || echo '?')
          text="Courses that follow a branch: $commits. Build: $BUILD; parity: ${PARITY:-skipped}; build comparison: ${BUILDS:-skipped}."
          for report in following-parity following-builds; do
            if [ -f "$RUNNER_TEMP/$report/report.md" ]; then text="$text"$'\n\n'"$(head -c 2800 "$RUNNER_TEMP/$report/report.md")"; fi
          done
          level=notice
          for outcome in "$BUILD" "$PARITY" "$BUILDS"; do if [ "$outcome" = failure ]; then level=warning; fi; done
          printf '%s\n' "$text" >> "$GITHUB_STEP_SUMMARY"
          printf '::%s title=Courses that follow a branch (informational)::%s\n' "$level" "$(printf '%s' "$text" | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\n/%0A/g')"
          exit 0
      - uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: following-branch
          path: |
            ${{ runner.temp }}/following-parity/report.*
            ${{ runner.temp }}/following-builds/report.*
          if-no-files-found: ignore
