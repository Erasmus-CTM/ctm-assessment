name: Quarto versions

# Which Quarto versions the bundled components work with: the package and
# every component's tests, built with each version. Used to set
# `quarto-required` to the earliest version that works (and to notice when a
# newer release breaks something). On demand, weekly, and when this changes.
on:
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * 1'
  push:
    paths:
      - .github/workflows/quarto-versions.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        quarto: ['1.4.557', '1.5.57', '1.6.42', '1.7.32', '1.8.27', 'release']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Native checks use the SymPy that the browser's Pyodide ships.
      - run: python -m pip install sympy==1.13.3 'networkx>=3.4' 'PyYAML>=6'
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: ${{ matrix.quarto }}
      - name: Build and test with Quarto ${{ matrix.quarto }}
        run: |
          set -o pipefail
          quarto --version
          python scripts/setup-feedback-integration.py --test --any-quarto 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Report the result as an annotation
        if: always()
        run: |
          version=$(quarto --version 2>/dev/null || echo "not installed")
          if [ "${{ job.status }}" = "success" ]; then
            echo "::notice title=Quarto ${{ matrix.quarto }} ($version)::package and component tests passed"
          else
            text=$( (grep -E "not ok|Error|error:|FATAL|ERROR|assert|older than" "$RUNNER_TEMP/build.log" 2>/dev/null || tail -40 "$RUNNER_TEMP/build.log" 2>/dev/null || echo "setup failed") | head -c 3000 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=Quarto ${{ matrix.quarto }} ($version)::$text"
          fi
