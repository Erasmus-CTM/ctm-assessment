name: Quarto versions

# The package and every component's tests with the earliest supported Quarto
# (quarto-required: >=1.8.27, the version fully tested) and with the current
# release. Quarto 1.10 sends pages with hyphenated blocks such as
# {math-exercise} to Jupyter (reported upstream; see the audit report), so the
# release job installs Jupyter, as courses building with 1.10 must, and notes
# when the workaround is still needed. On demand, weekly, and when this file
# changes.
on:
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * 1'
  push:
    paths:
      - .github/workflows/quarto-versions.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: ${{ matrix.quarto == 'release' }}
    strategy:
      fail-fast: false
      matrix:
        quarto: ['1.8.27', 'release']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Native checks use the SymPy that the browser's Pyodide (0.28.3) ships.
      - run: python -m pip install sympy==1.13.3 'networkx>=3.4' 'PyYAML>=6'
      - name: Jupyter for Quarto 1.10 and later
        if: matrix.quarto == 'release'
        run: python -m pip install jupyter
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: ${{ matrix.quarto }}
      - name: Build and test with Quarto ${{ matrix.quarto }}
        run: |
          set -o pipefail
          quarto --version
          python scripts/setup-feedback-integration.py --test 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Report the result as an annotation
        if: always()
        run: |
          version=$(quarto --version 2>/dev/null || echo "not installed")
          if [ "${{ job.status }}" = "success" ]; then
            echo "::notice title=Quarto ${{ matrix.quarto }} ($version)::package and component tests passed"
          else
            text=$( (grep -E "not ok|Error|error:|FATAL|ERROR|older than|nbformat" "$RUNNER_TEMP/build.log" 2>/dev/null || tail -40 "$RUNNER_TEMP/build.log" 2>/dev/null || echo "setup failed") | head -c 3000 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::warning title=Quarto ${{ matrix.quarto }} ($version)::$text"
          fi
