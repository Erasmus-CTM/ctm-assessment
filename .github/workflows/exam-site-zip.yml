name: Rendered offline Python website ZIP
on:
  pull_request:
    paths: [integration/offline-ide/**, integration/p13-worker/**, tools/p13-shared-worker.mjs, integration/feedback/repos.json, integration/p13*.json, integration/assets-licences/**, scripts/*p13*.py, tools/p13-loading.cjs, scripts/ctm_assets.py, tools/p13-seb-profile.mjs, tools/p13-controls.mjs, tools/p13-serve.mjs, tests/p13-serve.test.cjs, tests/p13-controls.browser.cjs, .github/workflows/exam-site-zip.yml, docs/exam-site-zip.md]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: offline-python-zip-${{ github.ref }}
  cancel-in-progress: true
jobs:
  website:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ASSET_RUN_ID: '40389684095'
      REVIEWED_LOCK_SHA256: 73d8b6fb0de3cd5b8d3ec8e7932d96f854bedf07ab7b7af43013d3cd1f347b3b
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Select reviewed component sources
        env:
          REVIEW_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/ci/review-dependencies.py
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.8.27'
      - run: python -m pip install sympy==1.13.3 'networkx>=3.4' 'PyYAML>=6'
      - run: npm ci --ignore-scripts
      - name: Require AC-approved complete lock for the exact application pins
        run: |
          python - <<'PYTHON'
          import json
          refs = json.load(open('integration/feedback/repos.json'))['repositories']
          receipt = json.load(open('integration/p13-complete-assets.json'))
          expected = {name:refs[name]['commit'] for name in ('ctm-libs','pyodide-interaktiv')}
          assert receipt['application_refs'] == expected, 'P13 complete lock awaits AC approval; review the unapproved-p13-lock-review artifact before changing the receipt'
          PYTHON
      - name: Download AC-approved #80 vendor baseline
        uses: actions/download-artifact@v7
        with:
          name: prebuilt-offline-assets
          run-id: ${{ env.ASSET_RUN_ID }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/approved-base-assets
      - name: Verify the approved baseline lock and carried bytes
        run: |
          python - <<'PYTHON'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          import ctm_assets as a
          base = Path(os.environ['RUNNER_TEMP'])/'approved-base-assets/inspection'
          raw = (base/'complete-lock.json').read_bytes()
          a.verify_bytes(raw, sha256=os.environ['REVIEWED_LOCK_SHA256'])
          lock = json.loads(raw)
          assert raw == a.json_bytes(lock)
          a.verify_bundle(base/'complete-built', lock)
          PYTHON
      - name: Read the exact worker source pins
        id: workers
        run: |
          python - <<'PYTHON'
          import json, os
          refs = json.load(open('integration/feedback/repos.json'))['repositories']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              for name in ('ctm-libs', 'pyodide-interaktiv'):
                  out.write(name + '=' + refs[name]['commit'] + '\n')
          PYTHON
      - uses: actions/checkout@v7
        with:
          repository: Erasmus-CTM/ctm-libs
          ref: ${{ steps.workers.outputs.ctm-libs }}
          path: _ci/p13-libs
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: Erasmus-CTM/pyodide-interaktiv
          ref: ${{ steps.workers.outputs.pyodide-interaktiv }}
          path: _ci/p13-ide
          persist-credentials: false
      - name: Reject altered deployed and compressed worker files
        run: python -m unittest discover -s tests -p test_p13_assets.py
      - name: Reproduce the reviewed complete assets including worker sources
        run: |
          python scripts/build-p13-assets.py --library-root _ci/p13-libs --ide-root _ci/p13-ide \
            --cache "$RUNNER_TEMP/assets-cache" --output "$RUNNER_TEMP/prebuilt-assets"
      - name: Install the pinned Python frontend and exercise components
        run: |
          python scripts/build-course.py --path integration/offline-ide \
            --dest "$RUNNER_TEMP/python-site" --workspace "$RUNNER_TEMP/package" --no-render
      - name: Verify and install complete assets; create standard profiles
        run: |
          python scripts/install-p13-site-assets.py --assets-dir "$RUNNER_TEMP/prebuilt-assets" \
            --project "$RUNNER_TEMP/python-site" --course-key python-ide
      - name: Render the offline exam website
        working-directory: ${{ runner.temp }}/python-site
        run: quarto render --profile offline,exam
      - name: ZIP website contents and extract the actual deployment
        run: |
          python - <<'PY'
          import json, os, shutil, sys, zipfile
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          import ctm_assets as a
          from p13_assets import verify_deployment
          root = Path(os.environ['RUNNER_TEMP'])
          site = root / 'python-site/_site-exam'
          assert (site / 'index.html').is_file() and (site / 'nested/index.html').is_file()
          lock = json.loads((root / 'prebuilt-assets/complete-lock.json').read_bytes())
          verify_deployment(site, lock)
          readme = Path('docs/exam-site-zip.md').read_text().split('<!-- IT -->\n', 1)[1].split('\n<!-- /IT -->', 1)[0]
          (site / 'README-IT.txt').write_text(readme + '\n', encoding='utf-8')
          output = root / 'python-offline-website.zip'
          with zipfile.ZipFile(output, 'w', compression=zipfile.ZIP_DEFLATED) as archive:
              for file in sorted(site.rglob('*')):
                  assert not file.is_symlink()
                  if not file.is_file():
                      continue
                  relative = file.relative_to(site)
                  assert not any(p.startswith('.private-') or p in {'.git', '.quarto', '_freeze', '_site-exam'} for p in relative.parts)
                  assert file.name not in {'complete-lock.json', 'assets-imports.json', 'pyodide-lock.full.json'}
                  if relative.parts[0] != '_ctm-assets':
                      assert '_extensions' not in relative.parts
                      assert not (file.name.startswith('_quarto') and file.suffix in {'.yml', '.yaml'})
                      assert file.suffix != '.qmd'
                  archive.write(file, relative.as_posix())
          deployed = root / 'deployed'
          with zipfile.ZipFile(output) as archive:
              assert archive.testzip() is None
              assert 'index.html' in archive.namelist() and '_site-exam/index.html' not in archive.namelist()
              archive.extractall(deployed)
          verify_deployment(deployed, lock)
          shutil.copytree(deployed, root / 'hosted/dept/python')
          print('Website ZIP sha256:', a.digest(output.read_bytes()))
          PY
      - name: Install Chromium from the supported browser platform
        timeout-minutes: 5
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          npx playwright install --with-deps chromium
      - name: Measure P16 startup strategies without changing production defaults
        run: |
          python scripts/prepare-p13-timing.py "$RUNNER_TEMP/python-site"
          (cd "$RUNNER_TEMP/python-site" && quarto render timing-math.qmd --profile offline && quarto render timing-python.qmd --profile offline)
          CTM_TIMING_P13=1 CTM_INTEGRATION_SITE="$RUNNER_TEMP/python-site/_site" \
            node integration/feedback/loading-timing.cjs "$RUNNER_TEMP/p13-loading-timing.json"
      - name: Build and test concurrent IDE, Python and mathematics consumers
        run: |
          python scripts/build-course.py --path integration/p13-worker --dest "$RUNNER_TEMP/p13-mixed" \
            --workspace "$RUNNER_TEMP/mixed-package" --no-render
          python scripts/install-p13-site-assets.py --assets-dir "$RUNNER_TEMP/prebuilt-assets" \
            --project "$RUNNER_TEMP/p13-mixed" --course-key p13-mixed
          (cd "$RUNNER_TEMP/p13-mixed" && quarto render --profile offline,exam)
          P13_MIXED_SITE="$RUNNER_TEMP/p13-mixed/_site-exam" P13_MIXED_REPORT="$RUNNER_TEMP/p13-shared-worker.json" \
            node tools/p13-shared-worker.mjs
      - name: Serve the extracted website using ordinary static hosting and optional headers
        run: |
          python -m http.server 8765 --bind 0.0.0.0 --directory "$RUNNER_TEMP/deployed" > "$RUNNER_TEMP/plain.log" 2>&1 &
          python -m http.server 8767 --bind 0.0.0.0 --directory "$RUNNER_TEMP/hosted" > "$RUNNER_TEMP/subdirectory.log" 2>&1 &
          python scripts/serve-offline.py "$RUNNER_TEMP/deployed" --port 8766 > "$RUNNER_TEMP/headers.log" 2>&1 &
          python scripts/serve-offline.py "$RUNNER_TEMP/hosted" --port 8768 > "$RUNNER_TEMP/subdirectory-headers.log" 2>&1 &
          hostname -I | awk '{print $1}' > "$RUNNER_TEMP/lan-ip"
      - name: Exercise real Python without internet access
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import {launchOfflineBrowser, checkOfflinePages} from './tools/offline-check.mjs';
          import {chromium} from 'playwright';
          const root = process.env.RUNNER_TEMP, browser = await launchOfflineBrowser();
          let plainBrowser;
          const report = {scope: 'two-page Python IDE only; no graders, boards or Maxima', strict: [], plainLAN: []};
          const basicCode = 'print("IDE_OFFLINE_OK", 20 + 22)';
          const optionalCode = 'import numpy as np\nprint("IDE_OFFLINE_OK", int(np.array([20, 22]).sum()))';
          async function runIDE(page, entry) {
            const code = entry.path.startsWith('nested/') ? optionalCode : basicCode;
            const requests = [];
            page.on('request', request => {if (/\/_ctm-assets\/pyodide\//.test(request.url())) requests.push(request.url());});
            await page.waitForFunction(() => globalThis.qpyodideCellContainer?.cells[0]?.primaryUnit?.editor,
              null, {timeout: 180000});
            const editorObservedReadyMs = await page.evaluate(() => performance.now());
            await page.waitForFunction(() => globalThis.qpyodideCellsReady === true &&
              [...document.querySelectorAll('.qpyodide-button-run')].some(b => !b.disabled),
              null, {timeout: 180000});
            const runObservedEnabledMs = await page.evaluate(() => performance.now());
            await page.evaluate(code => qpyodideCellContainer.cells[0].primaryUnit.editor.setValue(code), code);
            const firstStart = Date.now();
            await page.locator('.qpyodide-button-run').first().click({timeout: 180000});
            await page.waitForFunction(() => document.querySelector('.qpyodide-output-code-area')
              ?.innerText.includes('IDE_OFFLINE_OK 42'), null, {timeout: 180000});
            const firstRunMs = Date.now() - firstStart;
            await page.waitForFunction(() => [...document.querySelectorAll('.qpyodide-button-run')]
              .every(b => b.innerText.trim() !== globalThis.QP_L?.stopLabel?.replace(/<[^>]*>/g, '').trim()));
            await page.evaluate(() => qpyodideCellContainer.cells[0].primaryUnit.editor.setValue('print("IDE_WARM_OK", 6 * 7)'));
            const warmStart = Date.now();
            await page.locator('.qpyodide-button-run').first().click();
            await page.waitForFunction(() => document.querySelector('.qpyodide-output-code-area')
              ?.innerText.includes('IDE_WARM_OK 42'), null, {timeout: 180000});
            const warmRunMs = Date.now() - warmStart;
            console.log('IDE_RUN_TIMING ' + JSON.stringify({url: page.url(), editorObservedReadyMs,
              runObservedEnabledMs, firstRunMs, warmRunMs}));
            await page.waitForFunction(() => [...document.querySelectorAll('.qpyodide-button-run')]
              .every(b => b.innerText.trim() !== QP_L.stopLabel.replace(/<[^>]*>/g, '').trim()));
            if (!fs.existsSync(path.join(root, 'python-ide.png')))
              await page.screenshot({path: path.join(root, 'python-ide.png'), fullPage: true});
            await page.evaluate(() => qpyodideCellContainer.cells[0].primaryUnit.editor.setValue(
              'loops = 0\ntry:\n    while True:\n        loops += 1\nexcept KeyboardInterrupt:\n    print("IDE_INTERRUPTED")'));
            await page.locator('.qpyodide-button-run').first().click();
            await page.waitForFunction(() => [...document.querySelectorAll('.qpyodide-button-run')]
              .some(b => b.innerText.trim() === QP_L.stopLabel.replace(/<[^>]*>/g, '').trim()));
            await page.waitForTimeout(500);
            const stopStart = Date.now();
            await page.locator('.qpyodide-button-run').first().click();
            await page.waitForFunction(() => [...document.querySelectorAll('.qpyodide-button-run')]
              .every(b => b.innerText.trim() !== QP_L.stopLabel.replace(/<[^>]*>/g, '').trim()),
              null, {timeout: 180000});
            await page.evaluate(() => qpyodideCellContainer.cells[0].primaryUnit.editor.setValue('print("IDE_AFTER_STOP_OK")'));
            await page.locator('.qpyodide-button-run').first().click({timeout: 180000});
            await page.waitForFunction(() => document.querySelector('.qpyodide-output-code-area')
              ?.innerText.includes('IDE_AFTER_STOP_OK'), null, {timeout: 180000});
            const stopRecoveryMs = Date.now() - stopStart;
            return {...await page.evaluate(() => ({secureContext: isSecureContext, isolated: crossOriginIsolated,
              output: document.querySelector('.qpyodide-output-code-area').innerText})),
              editorObservedReadyMs, runObservedEnabledMs, firstRunMs, warmRunMs, stopRecoveryMs,
              pythonRequestsObservedDuringProbe: requests};
          }
          try {
            for (const baseURL of ['http://127.0.0.1:8766/', 'http://127.0.0.1:8768/dept/python/']) {
              report.strict.push(await checkOfflinePages({browser, baseURL, loads: 5,
                pages: [{path: 'index.html', boards: 0}, {path: 'nested/index.html', boards: 0}],
                probes: [runIDE], scope: 'Python IDE root/subdirectory with isolation headers'}));
            }
            assert.ok(report.strict.every(result => result.ok), 'strict network-refused IDE acceptance');
            const ip = fs.readFileSync(path.join(root, 'lan-ip'), 'utf8').trim();
            assert.match(ip, /^\d{1,3}(?:\.\d{1,3}){3}$/);
            assert.notEqual(ip, '127.0.0.1');
            plainBrowser = await chromium.launch({headless: true, channel: 'chromium', args: [
              '--host-resolver-rules=MAP * ~NOTFOUND, EXCLUDE 127.0.0.1, EXCLUDE ' + ip,
              '--disable-background-networking', '--no-proxy-server']});
            for (const baseURL of ['http://' + ip + ':8765/', 'http://' + ip + ':8767/dept/python/']) {
              for (const name of ['index.html', 'nested/index.html']) {
                const context = await plainBrowser.newContext({serviceWorkers: 'block'});
                const evidence = {baseURL, path: name, external: [], errors: [], failed: [], responses: [], pythonRequests: []};
                let navigationStart = 0;
                context.on('request', request => {
                  if (/\/_ctm-assets\/pyodide\//.test(request.url()))
                    evidence.pythonRequests.push({url: request.url(), msAfterNavigationStart: Date.now() - navigationStart});
                });
                await context.route('**/*', route => {
                  if (new URL(route.request().url()).origin !== new URL(baseURL).origin) {
                    evidence.external.push(route.request().url()); return route.abort('blockedbyclient');
                  }
                  return route.continue();
                });
                await context.routeWebSocket('**/*', socket => {evidence.external.push(socket.url()); socket.close();});
                context.on('page', page => page.on('pageerror', error => evidence.errors.push(error.message)));
                context.on('requestfailed', request => evidence.failed.push({url: request.url(), error: request.failure()?.errorText}));
                context.on('response', response => {if (response.status() >= 400) evidence.responses.push(response.url());});
                try {
                  const page = await context.newPage();
                  navigationStart = Date.now();
                  await page.goto(new URL(name, baseURL).href, {waitUntil: 'load'});
                  evidence.python = await runIDE(page, {path: name});
                  if (baseURL.endsWith(':8765/') && name === 'index.html')
                    await page.screenshot({path: path.join(root, 'python-ide.png'), fullPage: true});
                  assert.equal(evidence.python.secureContext, false, 'ordinary insecure LAN HTTP');
                  for (const key of ['external', 'errors', 'failed', 'responses']) assert.deepEqual(evidence[key], [], key);
                } finally {report.plainLAN.push(evidence); await context.close();}
              }
            }
            assert.ok(report.strict.every(result => result.ok), 'strict network-refused IDE acceptance');
          } finally {
            fs.writeFileSync(path.join(root, 'python-offline-checks.json'), JSON.stringify(report, null, 2));
            console.log('IDE_ACCEPTANCE ' + JSON.stringify({scope: report.scope,
              strict: report.strict.map(r => ({ok: r.ok, loads: r.loads,
                results: r.results.map(x => ({path: x.path, load: x.load, ok: x.ok, problems: x.problems, probes: x.probes}))})),
              plainLAN: report.plainLAN}));
            if (plainBrowser) await plainBrowser.close();
            await browser.close();
          }
          JS
      - name: Carry the candidate ZIP to the engine gates
        uses: actions/upload-artifact@v7
        with:
          name: p13-zip-candidate
          path: ${{ runner.temp }}/python-offline-website.zip
          compression-level: 0
          if-no-files-found: error
      - name: Preserve acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-offline-website-evidence
          path: |
            ${{ runner.temp }}/python-offline-checks.json
            ${{ runner.temp }}/p13-loading-timing.json
            ${{ runner.temp }}/p13-shared-worker.json
            ${{ runner.temp }}/python-ide.png
            ${{ runner.temp }}/plain.log
            ${{ runner.temp }}/subdirectory.log
            ${{ runner.temp }}/headers.log
            ${{ runner.temp }}/subdirectory-headers.log

  seb-engine-profile:
    needs: [website]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, engine: chromium, version: '139.0.7258.138', profile: cef139}
          - {os: ubuntu-24.04, engine: chromium, version: '147.0.7727.117', profile: cef147}
          - {os: macos-15, engine: webkit, version: '', profile: apple-webkit}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v7
        with:
          name: p13-zip-candidate
          path: ${{ runner.temp }}/zip
      - name: Extract the actual website ZIP
        run: |
          python - <<'PYTHON'
          import os, zipfile, shutil
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          with zipfile.ZipFile(root / 'zip/python-offline-website.zip') as archive:
              assert archive.testzip() is None
              archive.extractall(root / 'deployed')
          shutil.copytree(root / 'deployed', root / 'hosted/dept/python')
          PYTHON
      - name: Install the exact CEF release-branch Chromium profile
        timeout-minutes: 5
        if: matrix.engine == 'chromium'
        env:
          P13_CHROME_VERSION: ${{ matrix.version }}
        run: |
          python scripts/install-p13-chromium.py "$P13_CHROME_VERSION" "$RUNNER_TEMP/chrome"
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          npx playwright install-deps chromium
      - name: Install pinned Playwright WebKit on macOS
        if: matrix.engine == 'webkit'
        run: npx playwright install webkit
      - name: Serve plain LAN HTTP and a server with isolation headers
        run: |
          node tools/p13-serve.mjs "$RUNNER_TEMP/deployed" 8765 > "$RUNNER_TEMP/plain.log" 2>&1 &
          node tools/p13-serve.mjs "$RUNNER_TEMP/deployed" 8766 --isolated > "$RUNNER_TEMP/headers.log" 2>&1 &
          node tools/p13-serve.mjs "$RUNNER_TEMP/hosted" 8767 > "$RUNNER_TEMP/subdirectory.log" 2>&1 &
          node tools/p13-serve.mjs "$RUNNER_TEMP/hosted" 8768 --isolated > "$RUNNER_TEMP/subdirectory-headers.log" 2>&1 &
          for p13_port in 8765 8766 8767 8768; do
            p13_path=/index.html
            if [ "$p13_port" -ge 8767 ]; then p13_path=/dept/python/index.html; fi
            curl --noproxy '*' --retry 5 --retry-connrefused --retry-delay 1 --max-time 5 --silent --show-error --fail -I "http://127.0.0.1:$p13_port$p13_path" > /dev/null
          done
      - name: Verify the byte-preserving host and native-control negative cases
        env:
          P13_BROWSER: ${{ matrix.engine }}
        run: |
          if [ "$P13_BROWSER" = chromium ]; then export P13_BROWSER_EXECUTABLE="$RUNNER_TEMP/chrome/chrome-linux64/chrome"; fi
          node --test tests/p13-serve.test.cjs tests/p13-controls.browser.cjs
      - name: Check Run, Stop, input, NumPy, inert HTML and saved-answer restore
        env:
          P13_BROWSER: ${{ matrix.engine }}
          P13_EXPECT_BROWSER_VERSION: ${{ matrix.version }}
          P13_REPORT: ${{ runner.temp }}/seb-profile*.json
        run: |
          if [ "$P13_BROWSER" = chromium ]; then
            export P13_BROWSER_EXECUTABLE="$RUNNER_TEMP/chrome/chrome-linux64/chrome"
          fi
          P13_REPORT="$RUNNER_TEMP/seb-profile-root.json" node tools/p13-seb-profile.mjs
          P13_PATH_PREFIX=/dept/python/ P13_PORTS='{"plain":8767,"headers":8768}' \
            P13_REPORT="$RUNNER_TEMP/seb-profile-subdirectory.json" node tools/p13-seb-profile.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: p13-seb-${{ matrix.profile }}
          path: |
            ${{ runner.temp }}/seb-profile*.json
            ${{ runner.temp }}/chrome/receipt.json
            ${{ runner.temp }}/plain.log
            ${{ runner.temp }}/headers.log
            ${{ runner.temp }}/subdirectory.log
            ${{ runner.temp }}/subdirectory-headers.log

  accepted-website:
    needs: [website, seb-engine-profile]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: p13-zip-candidate
          path: ${{ runner.temp }}/accepted
      - name: Preserve the accepted website ZIP without an outer archive
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/accepted/python-offline-website.zip
          archive: false
          compression-level: 0
          if-no-files-found: error
