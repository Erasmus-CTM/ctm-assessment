name: Measure loading times

# Time to the first graded exercise (cold/warm cache, fast/slow network) and
# Pyodide runtime/package costs. Only on an explicitly confirmed broad campaign.
# D2 (consolidation step 3, T8): the combined page's first check
# comes within 2 s of the same page with pyodide-interaktiv's stage 2
# switched off, on the fast and the slow profile, or the job fails.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type broad testing campaign to authorize the broad jobs'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: measure-loading-${{ github.ref }}
  cancel-in-progress: true

jobs:
  campaign:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm the explicitly requested broad campaign
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != 'broad testing campaign' ]; then
            echo '::error::Broad jobs require the exact confirmation: broad testing campaign'
            exit 1
          fi

  measure:
    needs: [campaign]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install sympy==1.13.3 'networkx>=3.4' 'PyYAML>=6'  # SymPy: the version Pyodide 0.28.3 ships
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.8.27'
      - name: Build the pinned example site
        run: python scripts/setup-feedback-integration.py
      - name: Render single-component pages with the same extensions
        run: |
          work="$RUNNER_TEMP/timing"
          mkdir -p "$work"
          cp -r .feedback-workspace/site/_extensions "$work/_extensions"
          cp integration/feedback/timing/*.qmd "$work/"
          (cd "$work" && for page in timing-*.qmd; do quarto render "$page" --metadata-file _extensions/ctm-assessment/jsxgraph-pins.yml; done)
          cp -r "$work"/timing-*.html "$work"/timing-*_files .feedback-workspace/site/_site/
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Measure
        timeout-minutes: 45
        env:
          CTM_INTEGRATION_SITE: ${{ github.workspace }}/.feedback-workspace/site/_site
          CTM_TIMING_D2_LIMIT_S: '2'
        run: node integration/feedback/loading-timing.cjs "$RUNNER_TEMP/loading-timing.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: loading-timing
          path: ${{ runner.temp }}/loading-timing.json
