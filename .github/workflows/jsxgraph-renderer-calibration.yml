name: Exact JSXGraph renderer comparison contracts
on:
  pull_request:
    paths:
      - tools/compare-rendered/**
      - tools/compare-rendered.mjs
      - tests/compare-rendered-jsxgraph.cjs
      - .github/workflows/jsxgraph-renderer-calibration.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: renderer-contract-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
jobs:
  exact:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - before_repository: jsxgraph/jsxgraph-quarto
            before: before
            before_commit: 17de83e006cf8907a146cc6a2366f42a35463c6e
            side: after
            repository: jsxgraph/jsxgraph-quarto
            commit: e4ad81d82e1b56f86765026a3dd26f6975d29d57
          - before_repository: jsxgraph/jsxgraph-quarto
            before: before
            before_commit: 17de83e006cf8907a146cc6a2366f42a35463c6e
            side: release
            repository: aacchhee/jsxgraph-quarto
            commit: 49a1c7d575e08b2133e39098e8f9deda61567287
          - before_repository: aacchhee/jsxgraph-quarto
            before: git
            before_commit: e31b5d19cb7f282e220634c0e21304067910efff
            side: release
            repository: aacchhee/jsxgraph-quarto
            commit: 49a1c7d575e08b2133e39098e8f9deda61567287
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: ${{ matrix.before_repository }}
          ref: ${{ matrix.before_commit }}
          path: _ci/jsxgraph-before
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.commit }}
          path: _ci/jsxgraph-after
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.8.27'
      - name: Actual Quarto pixel/relative frames and rejection mutations
        env:
          JSXGRAPH_BEFORE_SOURCE: ${{ github.workspace }}/_ci/jsxgraph-before
          JSXGRAPH_AFTER_SOURCE: ${{ github.workspace }}/_ci/jsxgraph-after
          JSXGRAPH_BEFORE_SIDE: ${{ matrix.before }}
          JSXGRAPH_AFTER_SIDE: ${{ matrix.side }}
        run: |
          set -o pipefail
          node --check tools/compare-rendered/jsxgraph-renderer.mjs
          node tests/compare-rendered-jsxgraph.cjs
