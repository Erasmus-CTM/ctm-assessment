# Expected differences of consolidation step 4 on pages that do not use its
# Markdown: a page built with the package before step 4 (a course's pinned
# package, or the pull request's base) against one built with step 4's
# package, from the same sources (design §6.2, "package PRs").
#
# - A2 (ctm-libs 4acb7c6; e415cee since the A2 follow-ups): links into tabs are on by default (AC), so every
#   page with a tabset loads ui/ctm-nav.js and its styles, ui/ctm-ui.css;
#   `ctm-assessment: tab-links: false` turns them off.
# - B4 adds the saved answers' categories (store attributes, the page bar and
#   the manifest on exercise pages) with its pins.
#
# Rules: see step1.yml. Fields added for step 4 (tools/compare-rendered.mjs):
# `tabsets`, `reveals` and `embeds` count what the after page has (its
# .panel-tabset blocks, ctm-libs reveals and embedded pages); `ancestors` is
# where a DOM difference sits ("div.tab-pane > div.cell") and `content` the
# tags an added or removed element holds; `lost` and `gained` are the words a
# changed text lost and gained.
categories:
  - id: ctm-nav
    title: Links into tabs (ctm-libs ui/ctm-nav.js and ui/ctm-ui.css) on pages with a tabset, on by default
    match:
      - {area: file, change: added, what: '^(script ctm-nav/ctm-nav\.js|css ctm-ui/ctm-ui\.css)$', tabsets: '^[1-9]\d*$'}

  # Observed in PR28's complete examples report (133 rows, b045f850).
  # The tool sets these flags only after validating the full v1 manifest,
  # matching component metadata, shipped locale and exact generated bar.
  # No removed/changed prose, grading payload or existing metadata is covered.
  - id: store
    title: Shared saved-answer metadata and generated page controls
    match:
      - {area: file, change: added, store: '^dependency$'}
      - {area: config, change: added, object: '^ctm-store-manifest$', path: '^/$', store: '^manifest$'}
      - {area: config, change: changed, store: '^(py-metadata|cell-metadata)$'}
      - {area: dom, change: added, store: '^bar$'}
      - {area: dom, change: attribute added, store: '^attribute$'}

  # The assets validator checks raw URLs, source provenance, bytes and pairing.
  # No DOM, content, grading, general inline code or MathJax change is covered.
  - id: assets
    title: Canonical CDN asset migration
    match:
      - {area: file, assets: '^resource$'}
      - {area: inline, change: added, assets: '^configuration$'}
      - {area: inline, change: changed, assets: '^monaco$'}
