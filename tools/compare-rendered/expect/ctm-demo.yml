# aacchhee/ctm-demo only (with the step-4 files; compare-courses.yml loads
# the course's own file by its name).
#
# Its step-4 migration (M-demo) adds a test page for the step-4 features and
# the pages that belong to it (pages/step4-ui*.html: links from another page,
# the default titles in nb, nn and de), linked from the end of the index
# page, and brings the help page up to date. The pages are
# new: there is nothing to compare them with, so the browser comparison
# checks them on their own (compare-browser.mjs, check `new-only`).
categories:
  - id: step4-ui-test-pages
    title: ctm-demo's step-4 UI test pages, new in its migration (pages/step4-ui*.html)
    match:
      - {area: page, change: '^added$', page: '^pages/step4-ui(-[a-z]+)?\.html$'}

  # index.qmd links the test page in a paragraph after its tabset.
  - id: step4-ui-test-link
    title: The index page links the step-4 UI test page (a paragraph after its tabset)
    match:
      - {area: dom, page: '^index\.html$', change: '^added$', line: '^(</?p>|<a href="(\./)?pages/step4-ui\.html">|</a>|text: .*)$', ancestors: 'main#quarto-document-content\.content( > p( > a)?)?$'}

  # The help page names the step-4 Markdown (reveals, the tab-ids.lua line)
  # instead of the site scripts the migration removes.
  - id: help-step4
    title: The help page describes the step-4 Markdown instead of the removed site scripts
    match:
      - {area: dom, page: '^pages/help\.html$', ancestors: 'main#quarto-document-content\.content > section#(what-is-included|which-files-do-i-edit)\.level2( > .*)?$'}
